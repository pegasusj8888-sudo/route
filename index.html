<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="origin">
<title>배송 경로</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; }
  #map { width:100%; height:100vh; background:#e8eef4; }
  body.dark #map { background:#1b1f24; }
  #msg { position:fixed; top:50%; left:0; right:0; text-align:center;
         font-family:'맑은 고딕',sans-serif; color:#666; font-size:15px; }
  .iw { padding:10px 12px; min-width:120px; font-family:'맑은 고딕',sans-serif;
        font-size:13px; line-height:1.5; background:#fff; border-radius:10px;
        box-shadow:0 2px 12px rgba(0,0,0,0.35); }
  .iw b { display:block; margin-bottom:4px; color:#1A56C4; }
  .iw-close { float:right; cursor:pointer; color:#999; font-size:16px;
              margin:-4px -4px 0 0; }
  .iw-addr { display:flex; align-items:flex-start; gap:6px; margin-top:2px; }
  .iw-addr span { flex:1; word-break:keep-all; }
  .iw-copy { flex:none; cursor:pointer; border:1px solid #1A56C4; background:#fff;
             color:#1A56C4; font-size:11px; font-weight:bold; padding:2px 8px;
             border-radius:6px; font-family:inherit; white-space:nowrap; }
  .iw-copy:active { background:#1A56C4; color:#fff; }
  .iw-nav { display:block; width:100%; box-sizing:border-box; margin-top:7px;
            cursor:pointer; border:none; border-radius:7px;
            background:#03C75A; color:#fff; font-size:13px; font-weight:bold;
            padding:8px 10px; font-family:inherit; text-align:center;
            box-shadow:0 1px 4px rgba(0,0,0,0.25); }
  .iw-nav:active { background:#02a94d; }
  .iw-tmap { display:block; width:100%; box-sizing:border-box; margin-top:6px;
             cursor:pointer; border:none; border-radius:7px;
             background:#EE2453; color:#fff; font-size:13px; font-weight:bold;
             padding:8px 10px; font-family:inherit; text-align:center;
             box-shadow:0 1px 4px rgba(0,0,0,0.25); }
  .iw-tmap:active { background:#c81742; }
  #locBtn { position:fixed; right:14px; bottom:24px; z-index:200;
            width:48px; height:48px; border-radius:50%; border:none;
            background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.3);
            font-size:22px; cursor:pointer; display:flex;
            align-items:center; justify-content:center; }
  #ctrl { position:fixed; top:12px; left:12px; z-index:200; background:#fff;
          border-radius:8px; padding:8px 13px; box-shadow:0 2px 8px rgba(0,0,0,0.2);
          font-size:13px; display:flex; align-items:center; gap:7px; cursor:pointer;
          font-family:'맑은 고딕',sans-serif; }
  #ctrl label { cursor:pointer; font-weight:600; color:#1A56C4; }
  #ctrl2 { position:fixed; top:54px; left:12px; z-index:200; background:#fff;
           border-radius:8px; padding:8px 13px; box-shadow:0 2px 8px rgba(0,0,0,0.2);
           font-size:13px; display:flex; align-items:center; gap:7px; cursor:pointer;
           font-family:'맑은 고딕',sans-serif; }
  #ctrl2 label { cursor:pointer; font-weight:600; color:#1A56C4; }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">지도를 불러오는 중…</div>
<div id="ctrl" onclick="toggleRoute(event)">
  <input type="checkbox" id="routeChk" checked style="width:15px;height:15px;cursor:pointer;">
  <label for="routeChk">경로 표시</label>
</div>
<div id="ctrl2" onclick="toggleDark(event)">
  <input type="checkbox" id="darkChk" style="width:15px;height:15px;cursor:pointer;">
  <label for="darkChk">다크모드</label>
</div>
<button id="locBtn" title="내 위치로 이동" onclick="goMyLocation()">📍</button>

<script>
// gzip 압축 바이트를 UTF-8 문자열로 해제
async function gunzipToString(u8) {
  var ds = new DecompressionStream("gzip");
  var ab = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder("utf-8").decode(ab);
}

// ── 링크(#뒤)에 담긴 경로 데이터 읽기 ───────────────────────────
// 새 링크는 gzip 압축(별명·주소·경로 모두 포함), 옛 링크는 비압축 — 자동 인식
async function loadData() {
  var h = location.hash ? location.hash.substring(1) : "";
  if (!h) return null;
  try {
    var b64 = h.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64);
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var jsonStr;
    if (u8.length > 1 && u8[0] === 0x1f && u8[1] === 0x8b) {   // gzip 매직넘버
      jsonStr = await gunzipToString(u8);
    } else {                                                   // 옛 비압축(UTF-8 JSON)
      jsonStr = decodeURIComponent(escape(bin));
    }
    return JSON.parse(jsonStr);
  } catch (e) {
    return null;
  }
}

var DATA = null;
var map, infoWindow, polyline = null, myMarker = null, myWatch = null;
var currentAddr = "";

// HTML 특수문자 이스케이프 (주소·별명 안전 표시)
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// 버튼의 data 속성에서 좌표·이름을 읽어 길찾기 실행 (onclick 따옴표 충돌 방지)
function navFromBtn(btn) {
  if (!btn) return;
  var dlat = parseFloat(btn.getAttribute("data-lat"));
  var dlng = parseFloat(btn.getAttribute("data-lng"));
  var dname = btn.getAttribute("data-name") || "목적지";
  if (isNaN(dlat) || isNaN(dlng)) { alert("길찾기 좌표가 없습니다."); return; }
  naverNav(dlat, dlng, dname);
}

// 네이버 지도 앱으로 자동차 길찾기 (현재 위치 → 목적지 좌표)
// 입구1이 있으면 입구1 좌표로 안내한다. 앱이 없으면 스토어/웹으로 대체.
function naverNav(dlat, dlng, dname) {
  var nm = encodeURIComponent(dname || "목적지");
  var appname = encodeURIComponent(location.hostname || "delivery-route");
  var scheme = "nmap://route/car?dlat=" + dlat + "&dlng=" + dlng
             + "&dname=" + nm + "&appname=" + appname;
  var isAndroid = /android/i.test(navigator.userAgent);
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  // 앱 미설치 대비: 잠시 후에도 페이지가 그대로면 스토어(iOS)/웹지도로 이동
  var webFallback = "https://map.naver.com/p/directions/-/" + dlng + "," + dlat + ",,,/-/car";
  if (isAndroid) {
    // 인텐트 URL: 앱 없으면 자동으로 Play 스토어로
    var intentUrl = "intent://route/car?dlat=" + dlat + "&dlng=" + dlng
      + "&dname=" + nm + "&appname=" + appname
      + "#Intent;scheme=nmap;action=android.intent.action.VIEW;"
      + "category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end";
    location.href = intentUrl;
    return;
  }
  var clickedAt = Date.now();
  location.href = scheme;
  if (isIOS) {
    setTimeout(function() {
      if (Date.now() - clickedAt < 2000) {
        location.href = "http://itunes.apple.com/app/id311867728?mt=8";
      }
    }, 1500);
  } else {
    // PC 등: 앱이 안 열리면 웹 지도 길찾기로
    setTimeout(function() {
      if (Date.now() - clickedAt < 2000) { window.open(webFallback, "_blank"); }
    }, 1200);
  }
}

// T맵 버튼: data 속성에서 좌표·이름을 읽어 티맵 길찾기 실행
function tmapFromBtn(btn) {
  if (!btn) return;
  var dlat = parseFloat(btn.getAttribute("data-lat"));
  var dlng = parseFloat(btn.getAttribute("data-lng"));
  var dname = btn.getAttribute("data-name") || "목적지";
  if (isNaN(dlat) || isNaN(dlng)) { alert("길찾기 좌표가 없습니다."); return; }
  tmapNav(dlat, dlng, dname);
}

// 티맵 앱으로 자동차 길찾기 (현재 위치 → 목적지 좌표).
// 입구1이 있으면 입구1 좌표로 안내. goalx=경도, goaly=위도.
// (rGoName/rGoX/rGoY 는 iOS 전용 → 안드로이드에서 목적지가 비어버림.
//  goalname/goalx/goaly 는 iOS·안드로이드 양쪽 모두 동작한다.)
function tmapNav(dlat, dlng, dname) {
  var nm = encodeURIComponent(dname || "목적지");
  var isAndroid = /android/i.test(navigator.userAgent);
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var query = "goalname=" + nm + "&goalx=" + dlng + "&goaly=" + dlat;
  var scheme = "tmap://route?" + query;
  if (isAndroid) {
    // 인텐트 URL: 앱 없으면 자동으로 Play 스토어로(패키지 com.skt.tmap.ku)
    var intentUrl = "intent://route?" + query
      + "#Intent;scheme=tmap;action=android.intent.action.VIEW;"
      + "category=android.intent.category.BROWSABLE;package=com.skt.tmap.ku;end";
    location.href = intentUrl;
    return;
  }
  var clickedAt = Date.now();
  location.href = scheme;
  if (isIOS) {
    setTimeout(function() {
      if (Date.now() - clickedAt < 2000) {
        location.href = "http://itunes.apple.com/app/id431589174?mt=8";
      }
    }, 1500);
  }
}

// infoWindow(네이버 지도 오버레이) 안의 onclick 에서 확실히 찾도록 전역에 등록
window.navFromBtn = navFromBtn;
window.naverNav = naverNav;
window.tmapFromBtn = tmapFromBtn;
window.tmapNav = tmapNav;

// 현재 정보창의 주소를 클립보드로 복사
function copyCurrentAddr(btn) {
  if (!currentAddr) return;
  var done = function() {
    var old = btn.textContent;
    btn.textContent = "복사됨";
    setTimeout(function(){ btn.textContent = "복사"; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(currentAddr).then(done).catch(function() {
      fallbackCopy(currentAddr); done();
    });
  } else {
    fallbackCopy(currentAddr); done();
  }
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

loadData().then(function (d) {
  DATA = d;
  if (!DATA || !DATA.m || !DATA.m.length) {
    document.getElementById("msg").textContent =
      "경로 데이터가 없습니다. 앱에서 보낸 링크 전체를 열어주세요.";
    return;
  }
  document.getElementById("msg").style.display = "none";

  // 네이버 인증 요청에는 '현재 페이지 주소 전체'가 들어간다. 우리 링크는 #뒤에
  // 경로 데이터가 통째로 있어 주소가 수천 자라, 인증 URL이 한도를 넘어 막힌다.
  // → 지도 스크립트를 부르기 전에 #해시를 잠깐 떼어 인증 URL을 짧게 만들고,
  //   지도 로드 후 다시 붙인다(새로고침/북마크 대비).
  var savedHash = location.hash;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}

  var s = document.createElement("script");
  s.src = "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=2bssycplso";
  s.onload = function () {
    initMap();
    setTimeout(function () {
      try {
        if (savedHash)
          history.replaceState(null, "", location.pathname + location.search + savedHash);
      } catch (e) {}
    }, 2000);
  };
  s.onerror = function () {
    var m = document.getElementById("msg");
    m.style.display = "block";
    m.textContent = "지도를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
  };
  document.head.appendChild(s);
});

// 마커 종류별 스타일
function initMap() {
  var first = DATA.m[0];
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(first[0], first[1]),
    zoom: 12,
    mapTypeControl: false,
    zoomControl: false
  });
  infoWindow = new naver.maps.InfoWindow({
    backgroundColor: "transparent", borderWidth: 0, disableAnchor: true,
    pixelOffset: new naver.maps.Point(0, -4)
  });
  var bounds = new naver.maps.LatLngBounds();

  // 배송지/출발/도착 마커
  // m 항목 = [lat, lng, label, name, addr, type]
  DATA.m.forEach(function(d) {
    var lat=d[0], lng=d[1], label=d[2], name=d[3]||"", addr=d[4]||"", type=d[5]||"stop";
    var pos = new naver.maps.LatLng(lat, lng);
    bounds.extend(pos);
    var bg = (type==="start") ? "#7B2FBF" : (type==="end" ? "#C0392B" : "#FFD400");
    var fg = (type==="start" || type==="end") ? "#fff" : "#111";
    var content, anchor;
    var isPill = /[^0-9]/.test(label);   // 출발/도착, 또는 '16,17'처럼 합쳐진 라벨
    if (!isPill) {
      // 배송지(단일 번호): 숫자 원형 핀
      content = '<div class="ovl" style="background:'+bg+';width:23px;height:23px;'
        +'border-radius:50%;display:flex;align-items:center;justify-content:center;'
        +'font-size:16px;font-weight:bold;color:'+fg+';border:2px solid #fff;'
        +'box-shadow:0 2px 6px rgba(0,0,0,0.4);line-height:1;">'+label+'</div>';
      anchor = new naver.maps.Point(11.5, 11.5);
    } else {
      // 출발/도착/합쳐진 배송지: 글자가 한 줄에 들어가는 알약(가로) 핀
      var w = label.length * 11 + 22;   // 대략적 너비(중심 정렬용)
      content = '<div class="ovl" style="background:'+bg+';display:inline-flex;'
        +'align-items:center;justify-content:center;padding:3px 9px;border-radius:12px;'
        +'white-space:nowrap;font-size:11px;font-weight:bold;color:'+fg+';border:2px solid #fff;'
        +'box-shadow:0 2px 6px rgba(0,0,0,0.4);line-height:1;">'+label+'</div>';
      anchor = new naver.maps.Point(w/2, 11);
    }
    var marker = new naver.maps.Marker({
      position: pos, map: map,
      zIndex: (type==="stop"?20:30),
      icon: { content: content, anchor: anchor },
      title: name || label
    });
    var openInfo = function() {
      currentAddr = addr;
      var tip = d[7] || "";
      // 길찾기 목적지: 입구1이 있으면 입구1 좌표, 없으면 배송지 좌표
      var ent0 = null;
      if (d[6] && d[6].length) {
        ent0 = Array.isArray(d[6][0]) ? d[6][0] : d[6];
      }
      var glat = (ent0 && ent0.length===2) ? ent0[0] : lat;
      var glng = (ent0 && ent0.length===2) ? ent0[1] : lng;
      var gname = (name || addr || "목적지");
      infoWindow.setContent(
        '<div class="iw"><span class="iw-close" onclick="infoWindow.close();">×</span>'
        + '<b>' + escapeHtml(label + (name ? ". " + name : "")) + '</b>'
        + (addr ? '<div class="iw-addr"><span>' + escapeHtml(addr) + '</span>'
            + '<button class="iw-copy" onclick="copyCurrentAddr(this)">복사</button></div>' : "")
        + '<button class="iw-nav" data-lat="' + glat + '" data-lng="' + glng
            + '" data-name="' + escapeHtml(String(gname)) + '" onclick="navFromBtn(this)">'
            + '\uD83D\uDDFA\uFE0F 네이버지도 길찾기</button>'
        + '<button class="iw-tmap" data-lat="' + glat + '" data-lng="' + glng
            + '" data-name="' + escapeHtml(String(gname)) + '" onclick="tmapFromBtn(this)">'
            + '\uD83D\uDE97 T맵 길찾기</button>'
        + (tip ? '<div style="margin-top:5px;padding-top:5px;border-top:1px solid #eee;'
            + 'color:#1565C0;white-space:pre-wrap;">💡 ' + escapeHtml(tip) + '</div>' : "")
        + '</div>');
      infoWindow.open(map, marker);
    };
    naver.maps.Event.addListener(marker, "click", openInfo);
    // 입구 표시: 핀에서 기록된 입구까지 형광초록 점선 + 점.
    // 입구 점을 눌러도 해당 배송지 정보가 열리도록 클릭 가능하게 둔다(겹쳐도 클릭됨).
    // d[6] = 입구 목록 [[lat,lng],...] (옛 링크는 단일 [lat,lng])
    var ent = d[6];
    if (ent && ent.length) {
      var entList = Array.isArray(ent[0]) ? ent : [ent];
      entList.forEach(function(p) {
        if (!p || p.length !== 2) return;
        new naver.maps.Polyline({
          map: map, zIndex: 5,
          path: [pos, new naver.maps.LatLng(p[0], p[1])],
          strokeColor:"#39FF14", strokeWeight:3, strokeStyle:"shortdash", strokeOpacity:0.95
        });
        var edot = new naver.maps.Marker({
          position: new naver.maps.LatLng(p[0], p[1]), map: map, zIndex: 100,
          icon: { content:'<div class="ovl" style="width:11px;height:11px;border-radius:50%;'
            +'background:#39FF14;box-shadow:0 1px 4px rgba(0,0,0,0.4);opacity:0.6;cursor:pointer;"></div>',
            anchor: new naver.maps.Point(6,6) },
          title: label + (name ? ". " + name : "") + " 입구"
        });
        naver.maps.Event.addListener(edot, "click", openInfo);
      });
    }
  });

  // 경로선: 상세 도로경로가 있으면 그걸로, 없으면 배송지 직선 연결
  // 새 링크는 델타정수(pd), 옛 링크는 절대좌표(p) — 둘 다 지원
  var roadPts = [];
  if (DATA.pd && DATA.pd.length) {
    var alat = 0, alng = 0;
    for (var i = 0; i < DATA.pd.length; i++) {
      alat += DATA.pd[i][0]; alng += DATA.pd[i][1];
      roadPts.push([alat / 1e5, alng / 1e5]);
    }
  } else if (DATA.p && DATA.p.length) {
    roadPts = DATA.p;
  }
  if (roadPts.length > 1) {
    polyline = new naver.maps.Polyline({
      map: map,
      path: roadPts.map(function(p){ return new naver.maps.LatLng(p[0], p[1]); }),
      strokeColor:"#FF4FA3", strokeWeight:4, strokeOpacity:0.85, strokeStyle:"solid"
    });
  } else {
    polyline = new naver.maps.Polyline({
      map: map,
      path: DATA.m.map(function(d){ return new naver.maps.LatLng(d[0], d[1]); }),
      strokeColor:"#2A6E1A", strokeWeight:3, strokeOpacity:0.6, strokeStyle:"shortdot"
    });
  }

  map.fitBounds(bounds, { top:70, right:60, bottom:90, left:60 });

  // 통행료 라벨: 통행료 있는 구간의 도로 중간점에 '통행료 N원'
  if (DATA.t && DATA.t.length) {
    DATA.t.forEach(function(t) {
      new naver.maps.Marker({
        position: new naver.maps.LatLng(t[0], t[1]),
        map: map,
        icon: {
          content: '<div class="ovl" style="background:#fff;border:1.5px solid #E8730C;color:#C25A00;'
            + 'font-size:11px;font-weight:bold;padding:2px 8px;border-radius:11px;'
            + 'white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.35);">'
            + '통행료 ' + t[2].toLocaleString() + '원</div>',
          anchor: new naver.maps.Point(34, 11)
        },
        clickable: false,
        zIndex: 50
      });
    });
  }

  naver.maps.Event.addListener(map, "click", function(){ infoWindow.close(); });

  // 타일이 새로 로드되거나 지도가 움직인 뒤마다 타일에만 다크 적용
  naver.maps.Event.addListener(map, "idle", applyDark);
  applyDark();

  startLocation();   // 현재 위치 추적 시작
}

// ── 현재 위치(휴대폰 GPS) 실시간 표시 ──────────────────────────
function startLocation() {
  if (!navigator.geolocation) return;
  myWatch = navigator.geolocation.watchPosition(function(pos) {
    var ll = new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
    if (!myMarker) {
      myMarker = new naver.maps.Marker({
        position: ll, map: map, zIndex: 999,
        icon: {
          content: '<div class="ovl" style="width:18px;height:18px;border-radius:50%;'
            +'background:#2D7FF9;border:3px solid #fff;'
            +'box-shadow:0 0 0 4px rgba(45,127,249,0.3),0 1px 4px rgba(0,0,0,0.4);"></div>',
          anchor: new naver.maps.Point(12, 12)
        }
      });
    } else {
      myMarker.setPosition(ll);
    }
  }, function(err) {
    // 권한 거부/실패 시 조용히 무시 (지도는 그대로 보임)
  }, { enableHighAccuracy:true, maximumAge:3000, timeout:15000 });
}

function goMyLocation() {
  if (myMarker) { map.setCenter(myMarker.getPosition()); map.setZoom(15); }
  else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      map.setCenter(new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
      map.setZoom(15);
    }, function(){ alert("위치를 가져오지 못했습니다. 위치 권한을 허용해 주세요."); },
    { enableHighAccuracy:true });
  } else { alert("이 브라우저는 위치 기능을 지원하지 않습니다."); }
}

function toggleRoute(ev) {
  var chk = document.getElementById("routeChk");
  if (ev && ev.target && ev.target.id !== "routeChk") chk.checked = !chk.checked;
  if (polyline) polyline.setMap(chk.checked ? map : null);
}

// 다크모드: 지도 '타일(이미지/캔버스)'에만 필터를 건다.
// invert로 길(흰색)→검정, 땅·건물(밝은 회색)→어두운 회색이 된다.
// brightness로 어두운 회색 영역을 위로 펼쳐(=조금 밝게) 땅/건물을 더 벌리고,
// (검정은 ×밝기로도 검정이라 길은 완전한 검정 유지) contrast로 분리를 살짝 강화.
// 핀·입구·경로선은 div/svg라 필터가 닿지 않아 색이 그대로 유지된다.
var DARK_FILTER = "invert(1) hue-rotate(180deg) brightness(1.8) contrast(1.1)";
function applyDark() {
  if (!map) return;
  var on = document.body.classList.contains("dark");
  var f = on ? DARK_FILTER : "";
  var tiles = document.querySelectorAll("#map img, #map canvas");
  for (var i = 0; i < tiles.length; i++) tiles[i].style.filter = f;
}

// 다크모드 토글: 체크 시 어둡게, 해제 시 기본(밝은) 모드
function toggleDark(ev) {
  var chk = document.getElementById("darkChk");
  if (ev && ev.target && ev.target.id !== "darkChk") chk.checked = !chk.checked;
  document.body.classList.toggle("dark", chk.checked);
  applyDark();
}
</script>
